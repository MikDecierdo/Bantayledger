    <title>BantayLedger AI</title>
    <!-- Opening animation of the Android and Windows apps; see the script below. -->
    <style>
      #bl-splash { display: none; }
      .bl-splash-on #bl-splash {
        position: fixed; inset: 0; z-index: 100000; display: flex;
        align-items: center; justify-content: center; background: #fff;
        font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        transition: transform 480ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      #bl-splash.is-leaving { transform: translateY(-100%); }
      /* The same size and place as the phone's own start screen, so nothing jumps. */
      .bl-splash__logo { height: min(34vmin, 300px); aspect-ratio: 967 / 1275; overflow: visible; }
      .bl-splash__name {
        position: absolute; left: 0; right: 0; top: calc(50% + min(17vmin, 150px) + 18px); margin: 0;
        text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #17221e; opacity: 0;
      }
      .bl-splash__name b { color: #1f6f5b; }
      /*
       * The complete logo shows while the app's code loads, because a slow phone can
       * pause animations then. Once the app is ready, the bars grow and the arrow shoots up.
       */
      .bl-splash__logo .sp-bar, .bl-splash__logo .sp-arrow { transform-box: fill-box; }
      .is-playing .bl-splash__logo { animation: bl-sp-pulse 760ms cubic-bezier(0.22, 1, 0.36, 1); }
      .is-playing .sp-bar { transform-origin: 50% 100%; animation: bl-sp-grow 420ms cubic-bezier(0.22, 1, 0.36, 1) backwards; }
      .is-playing .sp-bar1 { animation-delay: 80ms; }
      .is-playing .sp-bar2 { animation-delay: 170ms; }
      .is-playing .sp-bar3 { animation-delay: 260ms; }
      .is-playing .sp-arrow { animation: bl-sp-shoot 500ms 340ms cubic-bezier(0.22, 1, 0.36, 1) backwards; }
      .is-playing .bl-splash__name { animation: bl-sp-up 420ms 420ms ease-out forwards; }
      @keyframes bl-sp-pulse { from { transform: scale(0.96); } to { transform: none; } }
      @keyframes bl-sp-grow { from { transform: scaleY(0); } to { transform: none; } }
      @keyframes bl-sp-shoot { from { opacity: 0; transform: translate(-130px, 130px); } to { opacity: 1; transform: none; } }
      @keyframes bl-sp-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .is-playing .bl-splash__logo, .is-playing .sp-bar, .is-playing .sp-arrow { animation: none; }
        .is-playing .bl-splash__name { animation: none; opacity: 1; }
        .bl-splash-on #bl-splash { transition: opacity 200ms linear; }
        #bl-splash.is-leaving { transform: none; opacity: 0; }
      }
    </style>

    <script>
      /*
       * Only the installed apps show the opening animation: Windows runs at app://,
       * Android at https://localhost. ?blsplash shows it in a browser, to test or demonstrate it.
       */
      (function () {
        var root = document.documentElement;
        var splash = document.getElementById('bl-splash');
        var cap = window.Capacitor;
        var inApp =
          location.protocol === 'app:' ||
          (location.protocol === 'https:' && location.hostname === 'localhost') ||
          !!window.bantayledgerDesktop ||
          !!(cap && cap.isNativePlatform && cap.isNativePlatform());
        if (!inApp && !/[?&]blsplash\b/.test(location.search)) {
          splash.remove();
          return;
        }
        root.classList.add('bl-splash-on');
        var PLAY_MS = 1250;
        var playedAt = 0;
        var left = false;
        window.__blSplashPlay = function () {
          if (playedAt) return;
          playedAt = Date.now();
          splash.classList.add('is-playing');
        };
        window.__blSplashLeave = function leave() {
          if (left) return;
          var wait = playedAt ? PLAY_MS - (Date.now() - playedAt) : 100;
          if (wait > 0) {
            setTimeout(leave, wait);
            return;
          }
          left = true;
          splash.classList.add('is-leaving');
          setTimeout(function () {
            splash.remove();
            root.classList.remove('bl-splash-on');
          }, 520);
        };
        // The app normally says when it is ready; this covers a sleeping server or a failure.
        setTimeout(function () {
          window.__blSplashPlay();
          window.__blSplashLeave();
        }, 6000);
      })();
    </script>
    <div id="root"></div>
