# Render Blueprint for the BantayLedger API (Laravel in Docker, free plan).
#
# In Render: New → Blueprint → pick this repository. Render reads this file,
# creates the service and asks for every value marked `sync: false` (the
# secrets). See docs/DEPLOY_RENDER.md for the step-by-step guide.
#
# Free plan notes: the service sleeps after 15 minutes without visits and
# takes up to a minute to wake; files written on the server (uploaded product
# photos) are lost when it restarts or sleeps.

services:
  - type: web
    name: bantayledger-api
    runtime: docker
    plan: free
    rootDir: laravel-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: BantayLedger AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      # Paste the APP_KEY from laravel-server/.env (base64:...).
      - key: APP_KEY
        sync: false
      # The service's own address, e.g. https://bantayledger-api.onrender.com
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: mysql
      # From the Aiven MySQL service's "Connection information".
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The full text of Aiven's CA certificate (ca.pem), -----BEGIN … END-----.
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      # Keep database connections open between requests (much faster to a cloud database).
      - key: DB_PERSISTENT
        value: "true"
      # "Forgot password" emails, sent through Brevo's HTTPS API (Render's free
      # plan blocks SMTP). See docs/DEPLOY_RENDER.md → Email (Brevo).
      - key: MAIL_MAILER
        value: brevo
      - key: MAIL_FROM_NAME
        value: BantayLedger AI
      # The sender verified in Brevo (Senders, Domains & Dedicated IPs).
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Brevo → SMTP & API → API keys.
      - key: BREVO_API_KEY
        sync: false
      # Reset links in the emails open the website.
      - key: FRONTEND_URL
        value: https://bantayledger-web.onrender.com

  # The website: public home page with the downloads, plus the full web app.
  # A static site (free, never sleeps). Installers are linked from the public
  # MikDecierdo/bantayledger-downloads releases, not stored here.
  - type: web
    name: bantayledger-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bantayledger-api.onrender.com/api
    routes:
      # Every app address (/login, /dashboard…) is served by the app itself.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
